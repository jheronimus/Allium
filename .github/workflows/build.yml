name: Build Allium (minime)

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'Cargo.*'
      - 'static/**'
      - '.github/workflows/build.yml'
      - 'third-party/dufs/**'
      - 'third-party/RetroArch-patch/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v20260720)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build minime (${{ matrix.libc }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: musl
            target: aarch64-unknown-linux-musl
          - libc: glibc
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential pkg-config \
            libsdl2-dev cmake musl-tools musl-dev

      - name: Build Rust binaries
        run: |
          cargo build --release --target ${{ matrix.target }} --features minime \
            --bin alliumd \
            --bin allium-launcher \
            --bin allium-menu \
            --bin activity-tracker \
            --bin screenshot \
            --bin screenshot-viewer \
            --bin say \
            --bin show

      - name: Build dufs
        run: |
          cd third-party/dufs
          cargo build --release --target ${{ matrix.target }} || echo "dufs build skipped"

      - name: Download syncthing (aarch64)
        run: |
          SYNCTHING_VERSION="v2.0.10"
          wget -q "https://github.com/syncthing/syncthing/releases/download/${SYNCTHING_VERSION}/syncthing-linux-arm64-${SYNCTHING_VERSION}.tar.gz" -O /tmp/st.tar.gz
          mkdir -p /tmp/st && tar xf /tmp/st.tar.gz -C /tmp/st
          find /tmp/st -name syncthing -exec cp {} /tmp/ \;

      - name: Assemble release
        run: |
          BUILD=target/${{ matrix.target }}/release
          STATIC=static

          mkdir -p release/.ui/bin
          mkdir -p release/.ui/config
          mkdir -p release/.ui/state
          mkdir -p release/.ui/themes
          mkdir -p release/.ui/fonts
          mkdir -p release/.tmp_update/bin
          mkdir -p release/apps
          mkdir -p release/RetroArch
          mkdir -p release/Roms
          mkdir -p release/Saves
          mkdir -p release/BIOS

          cp $BUILD/alliumd release/.ui/bin/
          cp $BUILD/allium-launcher release/.ui/bin/
          cp $BUILD/allium-menu release/.ui/bin/
          cp $BUILD/screenshot release/.tmp_update/bin/
          cp $BUILD/say release/.tmp_update/bin/
          cp $BUILD/show release/.tmp_update/bin/

          cp $BUILD/activity-tracker "release/apps/Activity Tracker.pak/" || true
          cp $BUILD/screenshot-viewer "release/apps/Screenshot Viewer.pak/" || true

          cp -r "$STATIC/Apps/Activity Tracker.pak/." "release/apps/Activity Tracker.pak/" || true
          cp -r "$STATIC/Apps/Screenshot Viewer.pak/." "release/apps/Screenshot Viewer.pak/" || true
          cp -r "$STATIC/Apps/"*.pak release/apps/ 2>/dev/null || true

          cp -r "$STATIC/RetroArch/." release/RetroArch/ || true
          [ -d "$STATIC/.minime" ] && cp -r "$STATIC/.minime" release/ || true

          [ -f third-party/dufs/target/${{ matrix.target }}/release/dufs ] && \
            cp third-party/dufs/target/${{ matrix.target }}/release/dufs release/.ui/bin/

          [ -f /tmp/syncthing ] && cp /tmp/syncthing release/.ui/bin/

          git rev-parse --short HEAD > release/.ui/version.txt

      - name: Package release zip
        run: |
          VER="${{ inputs.version }}"
          VER="${VER#v}"
          if [ -z "$VER" ]; then
            VER="$(date -u +%Y%m%d)"
          fi
          ZIP_NAME="allium-${VER}-${{ matrix.libc }}-aarch64.zip"
          cd release
          zip -r "../${ZIP_NAME}" .
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.event_name != 'workflow_dispatch' || inputs.version == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7
