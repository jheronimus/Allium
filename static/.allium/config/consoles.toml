# Allium console definitions for Minime.
#
# Trimmed to the systems Minime actually serves: every canonical Roms folder
# (MinUI naming, single source of truth in roms/mappings + the MinUI skeleton)
# plus the framework entries (Native/Ports, Movies). Sub-systems without a
# canonical Roms folder (Sega CD, 32X, FDS, SuperGrafx, ...) are not listed —
# MinUI does not create those folders. Shared cores come from the minime
# build-cores artifact.

[[consoles]]
name = "Atari 2600"
cores = ["stella", "stella2014"]
patterns = ["ATARI", "A26", "A2600"]
extensions = ["a26", "bin"]

[[consoles]]
name = "Atari Lynx"
cores = ["handy", "mednafen_lynx"]
patterns = ["LYNX"]
extensions = ["lnx"]

[[consoles]]
name = "Game Boy"
cores = ["gambatte", "tgbdual", "gearboy", "mgba", "vbam", "vba_next"]
patterns = ["GB", "TGB_Dual"]
extensions = ["gb"]

[[consoles]]
name = "Game Boy Color"
cores = ["gambatte", "tgbdual", "gearboy", "mgba", "vbam", "vba_next"]
patterns = ["GBC"]
extensions = ["gbc"]

[[consoles]]
name = "Game Boy Advance"
cores = ["gpsp", "mgba", "vbam", "vba_next"]
patterns = ["GBA", "MGBA"]
extensions = ["gba"]

[[consoles]]
name = "Super Game Boy"
cores = ["mgba", "tgbdual", "gearboy", "bsnes"]
patterns = ["SGB"]

[[consoles]]
name = "NES"
cores = ["fceumm", "nestopia"]
patterns = ["FC", "NES"]
extensions = ["nes", "unif", "unf"]

[[consoles]]
name = "SNES"
cores = [
    "mednafen_supafaust",
    "snes9x",
    "snes9x2010",
    "snes9x2005",
    "snes9x2005_plus",
    "snes9x2002",
    "chimerasnes",
]
patterns = ["SFC", "SNES", "SUPA"]
extensions = ["sfc", "smc", "swc", "fig"]

[[consoles]]
name = "Virtual Boy"
cores = ["mednafen_vb"]
patterns = ["VB"]
extensions = ["vb", "vboy"]

[[consoles]]
name = "PICO-8"
cores = ["fake08", "retro8"]
patterns = ["PICO", "P8"]
extensions = ["p8", "png"]

[[consoles]]
name = "Ports Collection"
cores = ["native"]
patterns = ["PORTS", "SH", "NATIVE"]
extensions = ["port"]

[[consoles]]
name = "Game Gear"
cores = ["picodrive", "genesis_plus_gx"]
patterns = ["GG"]
extensions = ["gg"]

[[consoles]]
name = "Genesis"
cores = ["picodrive", "genesis_plus_gx"]
patterns = ["MD"]
extensions = ["gen", "smd", "md"]

[[consoles]]
name = "Master System"
cores = ["picodrive", "genesis_plus_gx"]
patterns = ["MS", "SMS"]
extensions = ["sms"]

[[consoles]]
name = "Sega Saturn"
cores = ["yabasanshiro"]
patterns = ["SAT"]
extensions = ["cue", "chd", "iso", "bin"]

[[consoles]]
name = "Neo Geo Pocket Color"
cores = ["race", "mednafen_ngp"]
patterns = ["NGP", "NGC", "NGPC"]
extensions = ["ngp", "ngc"]

[[consoles]]
name = "PlayStation"
cores = ["pcsx_rearmed"]
patterns = ["PSX", "PS", "PS1"]
extensions = ["mdf", "pbp", "toc", "cbn"]

[[consoles]]
name = "TurboGrafx-16"
cores = ["mednafen_pce_fast"]
patterns = ["PCE"]
extensions = ["pce"]

[[consoles]]
name = "WonderSwanColor"
cores = ["mednafen_wswan"]
